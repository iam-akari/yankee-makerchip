<!doctype html>
<html><head><meta charset="utf-8"><title>chip render</title>
<style>html,body{margin:0;background:#e9e9ea}canvas{display:block}#s{position:fixed;left:8px;top:8px;font:12px sans-serif;color:#555}</style>
</head><body><div id="s">loading…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe9e9ea).convertSRGBToLinear();
const cam = new THREE.PerspectiveCamera(28, W / H, 1, 1000);
cam.position.set(0, -74, 86); cam.lookAt(0, 1, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.95);
sun.position.set(-40, -30, 90); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -60, right: 60, top: 60, bottom: -60});
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(50, 40, 40); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({opacity: 0.18}));
ground.receiveShadow = true; ground.position.z = -1.6; scene.add(ground);

const colors = ['#f28a1e', '#f4f2ec', '#262626', '#1f3a8f'];
const names = ['0_orange', '1_white', '2_black', '3_navy'];
const loader = new THREE.STLLoader();
const load = f => new Promise((ok, ng) => loader.load(f, ok, undefined, ng));

async function half(side) {
  const g = new THREE.Group();
  for (let c = 0; c < 4; c++) {
    let geo; try { geo = await load(`../stl_chip/${side}_${names[c]}.stl`); } catch (e) { continue; }
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: new THREE.Color(colors[c]).convertSRGBToLinear(), roughness: 0.6, metalness: 0}));
    m.castShadow = true; m.receiveShadow = true; g.add(m);
  }
  return g;
}
// full chip: front half on top, back half flipped underneath (rotated 180deg about Y, as glued)
async function chip() {
  // one-piece chip: z 0..3.2, back inlay on the bottom; centre it vertically
  const g = new THREE.Group();
  for (let c = 0; c < 4; c++) {
    let geo; try { geo = await load(`../onepiece/chip_${c}_${names[c].slice(2)}.stl`); } catch (e) { continue; }
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: new THREE.Color(colors[c]).convertSRGBToLinear(), roughness: 0.6, metalness: 0}));
    m.castShadow = true; m.receiveShadow = true; m.position.z = -1.6; g.add(m);
  }
  return g;
}
(async () => {
  const A = await chip(); A.position.set(-24, 0, 0); A.rotation.z = 0.05; scene.add(A);
  const B = (await chip()); const Bw = new THREE.Group(); B.rotation.y = Math.PI; Bw.add(B);
  Bw.position.set(24, 0, 0); Bw.rotation.z = -0.04; scene.add(Bw);
  renderer.render(scene, cam);
  document.getElementById('s').textContent = '';
  const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
  await fetch('/save?name=chip_render.png', {method: 'POST', body: blob});
  // close-up of the back (QR + X emblem)
  cam.position.set(24, -30, 62); cam.lookAt(24, 2, 0); renderer.render(scene, cam);
  const blob2 = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
  const res = await fetch('/save?name=chip_render_back.png', {method: 'POST', body: blob2});
  document.title = 'saved ' + res.status;
})().catch(e => { document.getElementById('s').textContent = 'ERR ' + e; document.title = 'error'; });
</script></body></html>
